name: Publish v1.4.3

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/release-v1.4.3.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      PATCH_GZ_B64: 
      EXPECTED_SHA256: b8ee68534678740e7e77772ad2f36e5e490a227d34befb0fbffa53ff39564a3d
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build v1.4.3 from current main source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object chatgpt-unified-long-chat-toolkit.user.js)" = "8a687c1e504eaa4163979b71811544844833ed8f"
          printf '%s' "$PATCH_GZ_B64" | base64 -d | gzip -d > /tmp/release-v1.4.3.patch
          git apply --check /tmp/release-v1.4.3.patch
          git apply /tmp/release-v1.4.3.patch
          node --check chatgpt-unified-long-chat-toolkit.user.js
          printf '%s  %s\n' "$EXPECTED_SHA256" chatgpt-unified-long-chat-toolkit.user.js | sha256sum -c -
          mkdir -p /tmp/release-assets
          cp chatgpt-unified-long-chat-toolkit.user.js /tmp/release-assets/chatgpt-unified-long-chat-toolkit-v1.4.3.user.js
          cp chatgpt-unified-long-chat-toolkit.user.js /tmp/release-assets/chatgpt-unified-long-chat-toolkit-v1.4.3.txt

      - name: Sync main userscript to v1.4.3
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/release-v1.4.3.yml
          git add chatgpt-unified-long-chat-toolkit.user.js .github/workflows/release-v1.4.3.yml
          git commit -m "release: v1.4.3"
          git push origin HEAD:main

      - name: Create GitHub Release
        shell: bash
        run: |
          set -euo pipefail
          NEW_SHA="$(git rev-parse HEAD)"
          gh release create v1.4.3 \
            /tmp/release-assets/chatgpt-unified-long-chat-toolkit-v1.4.3.user.js \
            /tmp/release-assets/chatgpt-unified-long-chat-toolkit-v1.4.3.txt \
            --repo "$GITHUB_REPOSITORY" \
            --target "$NEW_SHA" \
            --title "v1.4.3" \
            --notes "v1.4.3 更新：新增安全发送队列并将入口锚定到 ChatGPT 输入框右上角；移除提示词模块中的重复队列 UI 与入队按钮；新增双击公式复制 LaTeX，并可在 Aa 面板调节公式复制悬停边框颜色；继续保留完整会话导出、导航与滚动保护。"
