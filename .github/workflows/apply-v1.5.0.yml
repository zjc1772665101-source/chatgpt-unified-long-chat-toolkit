name: Apply v1.5.0 appearance override switches

on:
  push:
    paths:
      - .github/workflows/apply-v1.5.0.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch userscript
        run: python .github/scripts/apply_v1_5_0.py

      - name: Syntax check
        run: node --check chatgpt-unified-long-chat-toolkit.user.js

      - name: Commit update and remove temporary patch files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/apply-v1.5.0.yml
          rm .github/scripts/apply_v1_5_0.py
          git add -A
          git commit -m "feat: add per-setting appearance override switches"
          git push
